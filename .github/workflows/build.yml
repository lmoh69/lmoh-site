name: Pages Journal et anglais
on:
  push:
    paths: ['journal/articles.json', 'tools/build_site.py']
  schedule:
    - cron: '0 5 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/build_site.py
      - run: |
          git config user.name "lmoh-robot"
          git config user.email "lmoh-robot@users.noreply.github.com"
          git add -A
          git commit -m "Pages Journal et anglais regenerees" || echo "Rien a publier"
          git pull --rebase -q || true
          git push
