name: Journal automatique (IA gratuite)
on:
  schedule:
    - cron: '30 5 * * 2,5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Test sans publier'
        type: boolean
        default: false
permissions:
  contents: write
  models: read
concurrency:
  group: media
  cancel-in-progress: false
jobs:
  ecrire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Redaction de l'article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ai_write.py ${{ inputs.test && '--test' || '' }}
      - run: python tools/process_ai.py
      - run: python tools/build_site.py
      - run: python tools/services.py
      - run: python tools/gbp.py
      - run: python tools/ai_request.py
      - name: Alerte calendrier presque vide
        run: |
          R=$(python3 -c "import json;print(json.load(open('journal/request-meta.json')).get('restants',99))" 2>/dev/null || echo 99)
          if [ "$R" -le 2 ]; then curl -s "https://hook.eu1.make.com/q2w3luwppbu37blfaq8apmze5ka5ol4k?msg=Journal%20LMOH%20%3A%20il%20reste%20$R%20sujets%20dans%20le%20calendrier.%20Previens%20Claude%20pour%20en%20ajouter." > /dev/null; fi
      - run: |
          git config user.name "lmoh-robot"
          git config user.email "lmoh-robot@users.noreply.github.com"
          git add -A ':!tmp'
          git commit -m "Journal : article automatique" || echo "Rien a publier"
          git pull --rebase -q || true
          git push
      - name: Alerte en cas d'echec
        if: failure() && !inputs.test
        run: curl -s "https://hook.eu1.make.com/q2w3luwppbu37blfaq8apmze5ka5ol4k?msg=Journal%20LMOH%20%3A%20l%27article%20automatique%20n%27a%20pas%20pu%20etre%20publie.%20Previens%20Claude." > /dev/null
