<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page déplacée | LMOH Photography</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#1a1918;font-family:Jost,"Avenir Next","Helvetica Neue",Arial,sans-serif;font-weight:300;text-align:center;padding:2rem}
h1{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:400;font-size:2.2rem;margin:0 0 1rem}
p{color:#8a847c;margin:0 0 1.6rem}
a{display:inline-block;color:#fff;background:#1a1918;text-decoration:none;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;padding:1rem 1.8rem}
</style>
<script>
(function(){
 var p=decodeURIComponent(location.pathname).toLowerCase();
 if(p.indexOf('/en/journal')===0){location.replace('/en/journal/');return}
 if(p.indexOf('/journal')===0){location.replace('/journal/');return}
 if(p.indexOf('/en')===0){location.replace('/en/');return}
 var map=[['fiche','#/fiche-mariage'],['offre','#/offres'],['contact','#/contact'],['devis','#/contact'],['naissance','#/naissance'],['grossesse','#/naissance'],['bebe','#/naissance'],['famille','#/famille'],['couple','#/couple'],['engagement','#/couple'],['noir','#/noir-et-blanc'],['portrait','#/portrait'],['culinaire','#/culinaire'],['food','#/culinaire'],['entreprise','#/pro'],['corporate','#/pro'],['seminaire','#/pro'],['pro','#/pro'],['film','#/films'],['video','#/films'],['teaser','#/films'],['blog','#/blog'],['about','#/about'],['propos','#/about'],['client','#/client'],['galerie','#/client'],['monde','#/monde'],['mariage','#/mariage'],['wedding','#/mariage'],['portfolio','#/mariage']];
 for(var i=0;i<map.length;i++){if(p.indexOf(map[i][0])>-1){location.replace('/'+map[i][1]);return}}
 location.replace('/');
})();
</script>
</head>
<body>
<div>
<h1>Cette page a déménagé</h1>
<p>Le site LMOH Photography a fait peau neuve. Vous allez être redirigé vers l’accueil.</p>
<a href="/">Aller à l’accueil</a>
</div>
</body>
</html>
